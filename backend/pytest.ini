[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not integration"
pythonpath = .
asyncio_mode = auto
markers =
    integration: needs a running Ollama with the models pulled; run with -m integration
    postgres: needs TEST_DATABASE_URL pointing at Postgres with pgvector; skipped otherwise
